[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotloop-rec-espresso"
version = "0.1.0"
description = "End-to-end lightning audio extraction pipeline: SeedASR transcription, cognitive diarization, executive synthesis, and verifiable cold-storage archiving."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "granken" }
]
keywords = [
    "audio-transcription",
    "speech-to-text",
    "diarization",
    "meeting-minutes",
    "volcengine",
    "whisper",
    "llm",
    "obsidian",
    "pkm",
    "plotloop"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: General",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/granken/plotloop-rec-espresso"
Repository = "https://github.com/granken/plotloop-rec-espresso.git"
Issues = "https://github.com/granken/plotloop-rec-espresso/issues"

[project.scripts]
plotloop-espresso = "espresso.cli:main"
espresso = "espresso.cli:main"

[tool.setuptools.packages.find]
include = ["espresso*"]
